apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app-deployment
  labels:
    app: mi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-app
  template:
    metadata:
      labels:
        app: mi-app
    spec:
      containers:
      - name: mi-app
        image: us-central1-docker.pkg.dev/project-0b0f7de9-7759-4533-81f/mi-repo-devops/mi-app-devops:v1
        ports:
        - containerPort: 8080
